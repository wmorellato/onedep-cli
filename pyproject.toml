[tool.poetry]
name = "onedep_manager"
version = "0.2.0"
description = "Management application for OneDep instances."
authors = ["Weslley Morellato Bueno <wbueno@ebi.ac.uk>"]

[tool.poetry.scripts]
onedep-manager = "onedep_manager.main:cli"

[tool.poetry.dependencies]
python = "^3.9"
click = "^8.1"
gitpython = "^3.1"
paramiko = "^3.0"
psutil = "^5.9"
pyyaml = "^6.0"
rich = "^13.0"
textual = "==6.2.1"
# wwpdb.utils.config / wwpdb.io / wwpdb.utils.config are internal wwPDB
# packages, not published to public PyPI. This project has always relied on
# them being available in the environment some other way (private index,
# pre-installed base image, etc.) rather than through this dependency list;
# that gap predates this file's dependency additions and isn't resolved here.

[tool.poetry.group.dev.dependencies]
pytest = "^7.4"
pytest-asyncio = "^0.23"
ruff = "^0.6"

[tool.ruff]
line-length = 200
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "B"]
# Bare "except:" (E722) is exactly the pattern this project is moving away
# from; keep it selected rather than ignored.

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
